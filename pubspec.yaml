name: civicissue
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  image_picker: ^1.0.7
  path: ^1.9.0
  http: ^1.2.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  google_fonts: ^6.1.0
  google_mlkit_image_labeling: ^0.12.0
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  native_exif: ^0.8.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.0
  fl_chart: ^0.69.0
  speech_to_text: ^7.4.0
  timezone: ^0.10.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - .env
